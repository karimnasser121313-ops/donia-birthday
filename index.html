<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9f351f">
<title>عيد ميلاد سعيد دنيا ❤️</title>
<style>
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;background:#fff;color:#17151a;font-family:Tahoma,Arial,sans-serif}
.top{height:47vh;min-height:330px;max-height:520px;background:#a33a20;border-radius:0 0 48% 10%;position:absolute;inset:0 0 auto;z-index:0}
main{position:relative;z-index:1;width:min(100%,680px);margin:auto;padding:0 18px 42px}
.photo{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:9px;margin:410px auto 56px;box-shadow:0 7px 24px #0002}
h1{text-align:center;font-size:clamp(25px,5vw,36px);line-height:1.6;margin:0 0 20px;font-weight:700}
.message{font-size:clamp(19px,4.1vw,27px);line-height:1.9;text-align:center;color:#888;margin:0 0 40px}
.player{width:100%;border-radius:12px;background:#d7c9cd;padding:22px 20px;box-shadow:0 4px 12px #00000018}
audio{display:block;width:100%;height:60px}
.heart{color:#17151a}
@media(max-width:700px){
 .top{height:47vh;min-height:300px}
 .photo{margin-top: min(59vw,410px);margin-bottom:55px}
}
</style>
</head>
<body>
<div class="top" aria-hidden="true"></div>
<main>
  <img class="photo" src="birthday-cake.jpg" alt="تورتة عيد ميلاد مزينة بالورد الأحمر والقلوب والتاج">
  <h1>عيد ميلاد سعيد دنيا <span class="heart">♥ ♥ ♥ ♥ ♥</span></h1>
  <p class="message">"كل سنة وأنتي أجمل حاجة حصلت في حياتي، وكل سنة وأنتي منورة يومي ووجودك مخلي الدنيا أحلى. ربنا يديمك ليا يا روحي، وعقبال العمر كله سوا."</p>
  <div class="player">
    <audio controls preload="metadata">
      <source src="birthday-song.mp3" type="audio/mpeg">
      متصفحك لا يدعم تشغيل الصوت.
    </audio>
  </div>
</main>
</body>
</html>
